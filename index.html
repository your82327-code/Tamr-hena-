<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمر حنه - Tamr Hena</title>
    
    <!-- ربط ملف الـ Manifest لتفعيل خاصية تثبيت التطبيق -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">

    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            margin-bottom: 20px;
        }

        /* تنسيق العنوان وتعديل الكلمة الإنجليزية لتتساوى مع العربية */
        .brand-header {
            margin-bottom: 20px;
        }
        .brand-ar {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-color);
            margin: 0;
        }
        .brand-en {
            font-size: 18px;
            letter-spacing: 2px;
            color: #6b7280;
            margin-top: 5px;
            text-transform: uppercase;
            border-top: 1px solid #e5e7eb;
            display: inline-block;
            padding-top: 4px;
            width: 80%;
        }

        /* الأزرار التفاعلية (تثبيت ومشاركة) */
        .action-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .btn-secondary {
            background-color: #10b981;
        }
        .btn-secondary:hover {
            background-color: #059669;
        }

        /* لوحة التحكم والمميزات الـ 10 */
        .admin-panel {
            text-align: right;
            border-top: 2px dashed #e5e7eb;
            padding-top: 20px;
            margin-top: 20px;
        }
        .admin-panel h3 {
            margin-bottom: 15px;
            color: var(--primary-color);
            font-size: 18px;
        }
        .control-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .control-group label {
            font-size: 13px;
            font-weight: bold;
            color: #4b5563;
        }
        .control-group input, .control-group select {
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
        .checkbox-group {
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <!-- العنوان المنسق -->
        <div class="brand-header">
            <h1 class="brand-ar" id="titleAr">تمر حنه</h1>
            <div class="brand-en" id="titleEn">Tamr Hena</div>
        </div>

        <p id="welcomeText">مرحباً بك في تطبيقك الخاص! يمكنك التحكم في إعدادات التطبيق بالأسفل.</p>

        <!-- أزرار التثبيت والمشاركة -->
        <div class="action-btns">
            <button id="installBtn" class="btn" style="display: none;">📥 تثبيت التطبيق</button>
            <button id="shareBtn" class="btn btn-secondary">🔗 مشاركة التطبيق</button>
        </div>

        <!-- لوحة التحكم المتقدمة (10 مميزات) -->
        <div class="admin-panel">
            <h3>⚙️ لوحة التحكم المتقدمة (10 مميزات للتخصيص)</h3>
            
            <!-- 1. تغيير اسم التطبيق بالعربي -->
            <div class="control-group">
                <label>1. تعديل اسم التطبيق (عربي):</label>
                <input type="text" id="inputTitleAr" value="تمر حنه">
            </div>

            <!-- 2. تغيير اسم التطبيق بالانجليزي -->
            <div class="control-group">
                <label>2. تعديل الاسم (إنجليزي):</label>
                <input type="text" id="inputTitleEn" value="Tamr Hena">
            </div>

            <!-- 3. تغيير النص الترحيبي -->
            <div class="control-group">
                <label>3. تعديل النص الترحيبي:</label>
                <input type="text" id="inputWelcome" value="مرحباً بك في تطبيقك الخاص! يمكنك التحكم في إعدادات التطبيق بالأسفل.">
            </div>

            <!-- 4. تغيير اللون الأساسي للأزرار -->
            <div class="control-group">
                <label>4. لون الأزرار والعناصر الرئيسية:</label>
                <input type="color" id="inputPrimaryColor" value="#4f46e5">
            </div>

            <!-- 5. تغيير لون خلفية الموقع -->
            <div class="control-group">
                <label>5. لون خلفية الموقع:</label>
                <input type="color" id="inputBgColor" value="#f3f4f6">
            </div>

            <!-- 6. تغيير لون بطاقة المحتوى -->
            <div class="control-group">
                <label>6. لون بطاقة المحتوى:</label>
                <input type="color" id="inputCardBg" value="#ffffff">
            </div>

            <!-- 7. تفعيل/إيقاف إشعار ترحيبي عائم -->
            <div class="control-group checkbox-group">
                <input type="checkbox" id="inputNoticeActive" checked>
                <label>7. تفعيل شريط تنبيهات الإعلانات العلوي</label>
            </div>

            <!-- 8. نص التنبيه العلوي -->
            <div class="control-group">
                <label>8. نص شريط التنبيه العلوي:</label>
                <input type="text" id="inputNoticeText" value="🔥 أهلاً بك، تم تحديث لوحة التحكم بنجاح!">
            </div>

            <!-- 9. حجم خط العناوين -->
            <div class="control-group">
                <label>9. حجم خط العنوان الرئيسي:</label>
                <select id="inputTitleSize">
                    <option value="24px">صغير</option>
                    <option value="28px" selected>متوسط</option>
                    <option value="34px">كبير</option>
                </select>
            </div>

            <!-- 10. زر إعادة الضبط للافتراضي -->
            <div class="control-group" style="margin-top: 15px;">
                <button class="btn" style="background-color: #ef4444;" id="resetBtn">10. إعادة ضبط الإعدادات</button>
            </div>
        </div>
    </div>

    <!-- شريط التنبيهات العلوي -->
    <div id="topNotice" style="background:#4f46e5; color:white; padding:8px 15px; border-radius:6px; margin-bottom:15px; font-size:13px; display:none;">
        <span id="noticeContent">🔥 أهلاً بك، تم تحديث لوحة التحكم بنجاح!</span>
    </div>

    <script>
        const titleAr = document.getElementById('titleAr');
        const titleEn = document.getElementById('titleEn');
        const welcomeText = document.getElementById('welcomeText');
        const topNotice = document.getElementById('topNotice');
        const noticeContent = document.getElementById('noticeContent');

        const inputTitleAr = document.getElementById('inputTitleAr');
        const inputTitleEn = document.getElementById('inputTitleEn');
        const inputWelcome = document.getElementById('inputWelcome');
        const inputPrimaryColor = document.getElementById('inputPrimaryColor');
        const inputBgColor = document.getElementById('inputBgColor');
        const inputCardBg = document.getElementById('inputCardBg');
        const inputNoticeActive = document.getElementById('inputNoticeActive');
        const inputNoticeText = document.getElementById('inputNoticeText');
        const inputTitleSize = document.getElementById('inputTitleSize');
        const resetBtn = document.getElementById('resetBtn');

        function updateSettings() {
            titleAr.innerText = inputTitleAr.value;
            titleEn.innerText = inputTitleEn.value;
            welcomeText.innerText = inputWelcome.value;
            
            document.documentElement.style.setProperty('--primary-color', inputPrimaryColor.value);
            document.documentElement.style.setProperty('--bg-color', inputBgColor.value);
            document.documentElement.style.setProperty('--card-bg', inputCardBg.value);
            
            titleAr.style.fontSize = inputTitleSize.value;

            if (inputNoticeActive.checked) {
                topNotice.style.display = 'block';
                topNotice.style.backgroundColor = inputPrimaryColor.value;
                noticeContent.innerText = inputNoticeText.value;
            } else {
                topNotice.style.display = 'none';
            }

            const settings = {
                ar: inputTitleAr.value,
                en: inputTitleEn.value,
                welcome: inputWelcome.value,
                primary: inputPrimaryColor.value,
                bg: inputBgColor.value,
                card: inputCardBg.value,
                noticeActive: inputNoticeActive.checked,
                noticeText: inputNoticeText.value,
                size: inputTitleSize.value
            };
            localStorage.setItem('appSettings', JSON.stringify(settings));
        }
